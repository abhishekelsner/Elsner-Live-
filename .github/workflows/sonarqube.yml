# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow helps you trigger a SonarQube analysis of your code and populates
# GitHub Code Scanning alerts with the vulnerabilities found.
# (this feature is available starting from SonarQube 9.7, Developer Edition and above)

name: SonarQube analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarQube to decorate PRs with analysis results

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: pcov
          tools: composer, phpunit:11.5.57

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run JavaScript tests with coverage
        run: npm run test:js

      - name: Run PHP tests with coverage
        run: ./vendor/bin/phpunit --coverage-clover coverage/clover.xml

      - name: Verify coverage reports
        run: |
          test -f coverage/lcov.info && echo "JS LCOV coverage report found"
          test -f coverage/clover.xml && echo "PHP Clover coverage report found"

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # Generate a token on SonarQube, add it to the secrets of this repo with the name SONAR_TOKEN
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}   # add the URL of your instance to the secrets of this repo with the name SONAR_HOST_URL
        with:
          args: >
            -Dsonar.projectKey=abhishekelsner_Elsner-Live
            -Dsonar.organization=abhishekelsner
            -Dsonar.tests=tests
            -Dsonar.coverage.exclusions=tests/**,jest.config.js
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.php.coverage.reportPaths=coverage/clover.xml

